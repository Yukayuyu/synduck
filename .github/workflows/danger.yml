name: Danger

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: read
  statuses: write

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web install --save-dev danger

      - name: Run Danger
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx danger ci
