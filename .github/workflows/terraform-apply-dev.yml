name: Terraform Apply (dev)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::406428899591:role/synduck-gha-tf-dev
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/terraform/envs/dev/mvp_lambda/package-lock.json

      - name: Install Lambda deps (for archive_file)
        working-directory: infra/terraform/envs/dev/mvp_lambda
        run: npm ci

      - name: Terraform init
        working-directory: infra/terraform/envs/dev
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: infra/terraform/envs/dev
        run: terraform apply -auto-approve -input=false
