name: Web Deploy (dev)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-deploy-dev.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: web-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      TF_DIR: infra/terraform/envs/dev

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::406428899591:role/synduck-gha-tf-dev
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform output (dev)
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false

          echo "bucket=$(terraform output -raw web_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_domain=$(terraform output -raw web_cloudfront_domain)" >> $GITHUB_OUTPUT

          echo "web_url=$(terraform output -raw web_url)" >> $GITHUB_OUTPUT
          echo "api_base=$(terraform output -raw http_api_url)" >> $GITHUB_OUTPUT
          echo "cognito_domain=$(terraform output -raw cognito_domain)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> $GITHUB_OUTPUT

      - name: Resolve CloudFront distribution id
        id: cf
        run: |
          DOMAIN='${{ steps.tf.outputs.cf_domain }}'
          ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='${DOMAIN}'].Id | [0]" --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "Failed to resolve distribution id for domain: $DOMAIN" >&2
            exit 1
          fi
          echo "dist_id=$ID" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build (static export)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.tf.outputs.api_base }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.tf.outputs.cognito_domain }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
          NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${{ steps.tf.outputs.web_url }}/auth/callback/
          NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${{ steps.tf.outputs.web_url }}/
        run: |
          npm ci
          npm run build

      - name: Sync to S3
        run: |
          aws s3 sync apps/web/out "s3://${{ steps.tf.outputs.bucket }}" --delete

      - name: CloudFront invalidation
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ steps.cf.outputs.dist_id }}" --paths '/*'
