name: Context Canvas
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:windows
      - run: pnpm test:portable
      - run: pnpm exec playwright install --with-deps chromium webkit
        if: runner.os == 'Linux'
      - run: pnpm test:e2e
        if: runner.os == 'Linux'
      - run: pnpm exec playwright test --config playwright.webkit.config.ts
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.os }}
          path: test-results/
