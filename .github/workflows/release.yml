name: Context Canvas release
on:
  push:
    tags: ['canvas-v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Match release tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "canvas-v$version") { throw 'Tag does not match package version.' }
      - run: pnpm package:windows
      - run: pnpm test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: context-canvas-release
          path: release-output/
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: context-canvas-release
          path: release-output
      - name: Publish versioned package and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          release_version="${RELEASE_TAG#canvas-v}"
          if [[ "$release_version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-output/* --verify-tag --title "Context Canvas ${RELEASE_TAG#canvas-v}" --generate-notes "${prerelease[@]}"
