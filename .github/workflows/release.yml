name: Context Canvas release
on:
  push:
    tags: ['canvas-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify same-repository public release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("release.config.json", "utf8"));
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (config.repository !== process.env.GH_REPO) throw new Error("Release source must be this repository.");
            if (process.env.RELEASE_TAG !== `canvas-v${pkg.version}`) throw new Error("Tag does not match package version.");'
          metadata=$(gh api "repos/$GH_REPO")
          REPO_METADATA="$metadata" node --input-type=module -e '
            const repo = JSON.parse(process.env.REPO_METADATA);
            if (repo.private !== false || repo.archived || repo.default_branch !== "main") throw new Error("Publish requires an active public repository with main as default branch.");'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::The release tag changed after this run started.'
            exit 1
          fi
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in {1..60}; do
            runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=10")
            state=$(CI_RUNS="$runs" node --input-type=module -e '
              const runs = JSON.parse(process.env.CI_RUNS).workflow_runs;
              const run = runs.find(r => r.head_sha === process.env.GITHUB_SHA && r.head_branch === "main");
              if (!run || run.status !== "completed") console.log("pending");
              else console.log(run.conclusion === "success" ? "success" : "failed");')
            if [[ "$state" == success ]]; then exit 0; fi
            if [[ "$state" == failed ]]; then
              echo '::error::Main CI failed for the tagged commit. Fix main and publish a new version.'
              exit 1
            fi
            sleep 15
          done
          echo '::error::Successful main CI was not available for the tagged commit.'
          exit 1
  package:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: macos-15, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:${{ matrix.target }}
      - run: pnpm test:macos-bootstrap
        if: runner.os == 'macOS'
      - run: pnpm test:portable
      - name: Check compatibility with the previous bootstrap
        run: pnpm test:portable
        env:
          CANVAS_TEST_LEGACY_BOOTSTRAP: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: context-canvas-release-${{ matrix.target }}
          path: |
            release-output/*.zip
            release-output/*.zip.sha256
            release-output/context-canvas-update*.json
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: context-canvas-release-*
          merge-multiple: true
          path: release-output
      - name: Verify and publish this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          metadata=$(gh api "repos/$GH_REPO")
          REPO_METADATA="$metadata" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const repo = JSON.parse(process.env.REPO_METADATA);
            const config = JSON.parse(readFileSync("release.config.json", "utf8"));
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (repo.private !== false || repo.archived || config.repository !== process.env.GH_REPO) throw new Error("Release target must be this public repository.");
            let notes;
            for (const [prefix, feedName] of [["ContextCanvas-Windows", "context-canvas-update.json"], ["ContextCanvas-macOS", "context-canvas-update-macos.json"]]) {
              const feed = JSON.parse(readFileSync(`release-output/${feedName}`, "utf8"));
              if (feed.version !== pkg.version || process.env.RELEASE_TAG !== `canvas-v${feed.version}`) throw new Error("Release version mismatch.");
              const name = `${prefix}-${feed.version}.zip`;
              if (feed.archive.name !== name) throw new Error("Unexpected archive name.");
              const archive = readFileSync(`release-output/${name}`);
              const digest = createHash("sha256").update(archive).digest("hex");
              const sidecar = readFileSync(`release-output/${name}.sha256`, "utf8");
              if (archive.length !== feed.archive.bytes || digest !== feed.archive.sha256 || sidecar !== `${digest}  ${name}\n`) throw new Error("Release archive checksum/size mismatch.");
              notes ??= feed.notes;
            }
            writeFileSync("release-output/notes.txt", notes + "\n\nDownload the ZIP for your platform: Windows uses Start-ContextCanvas.cmd; macOS uses Start-Synduck.command. No GitHub token is required.\n");'
          tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::The release tag changed after verification.'
            exit 1
          fi
          release_version="${RELEASE_TAG#canvas-v}"
          prerelease=()
          if [[ "$release_version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "release-output/ContextCanvas-Windows-$release_version.zip" \
            "release-output/ContextCanvas-Windows-$release_version.zip.sha256" \
            "release-output/ContextCanvas-macOS-$release_version.zip" \
            "release-output/ContextCanvas-macOS-$release_version.zip.sha256" \
            release-output/context-canvas-update.json \
            release-output/context-canvas-update-macos.json \
            --verify-tag --title "Context Canvas $release_version" \
            --notes-file release-output/notes.txt "${prerelease[@]}"
